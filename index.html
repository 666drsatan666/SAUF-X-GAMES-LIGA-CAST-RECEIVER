<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAUF-X-GAMES Cast Receiver</title><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><style>html,body{margin:0;min-height:100%;background:#071525;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.screen{width:min(92vw,1500px);text-align:center;padding:4vh 4vw}.brand{color:#f2ce75;font-weight:900;letter-spacing:.16em;font-size:clamp(18px,2vw,32px)}h1{font-size:clamp(40px,8vw,120px);margin:2vh 0}h2{font-size:clamp(28px,5vw,72px);color:#f2ce75}.hero{font-size:clamp(28px,6vw,96px);font-weight:900}.meta{font-size:clamp(18px,3vw,42px);color:#dbe8f2}.card{border:2px solid #d4a63f88;border-radius:22px;padding:4vh 4vw;background:#102c4a;box-shadow:0 20px 80px #0008}.status{font-size:clamp(16px,2vw,28px);color:#a9bacb}</style></head><body><main class="screen"><div class="brand">SAUF-X-GAMES LIGA</div><section class="card"><h1>BIERISCHER TRIATHLON</h1><h2 id="phase">Warte auf Turnierdaten</h2><div id="content" class="hero">CAST RECEIVER BEREIT</div><p id="meta" class="meta">Separate Zuschaueransicht</p></section><p class="status">Handy bleibt Steuerzentrale Â· Cast-Receiver</p></main><script>const NS='urn:x-cast:at.bierwart.triathlon.presentation';const context=cast.framework.CastReceiverContext.getInstance();function render(payload){const state=payload?.state||{};const matches=[...(state.groupMatches||[]),...((state.bracket?.rounds||[]).flat()||[])];const done=matches.filter(m=>m.sa!==null&&m.sb!==null);const last=done.at(-1);document.getElementById('phase').textContent=state.tournament?.phase||'Turnier';document.getElementById('content').textContent=last?`${last.sa}:${last.sb}`:'Warte auf Ergebnis';document.getElementById('meta').textContent=last?`Partie Â· ${last.discipline||''}`:'Bereit fÃ¼r Turnierdaten'}context.addCustomMessageListener(NS,event=>{try{const payload=JSON.parse(event.data||'{}');if(payload.type==='state')render(payload)}catch(error){console.error(error)}});context.start();</script></body></html>
